<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">agent-video-editor</title>
  <desc id="d">El criterio de un editor de video para agentes de IA: una línea de tiempo con voz, pantalla, gráficos y música.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F14"/>
      <stop offset="1" stop-color="#161A23"/>
    </linearGradient>
    <linearGradient id="voz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B83D"/>
      <stop offset="1" stop-color="#F28C38"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#F5B83D" font-size="15" font-weight="600" letter-spacing="3">SKILL DE EDICIÓN DE VIDEO</text>
    <text x="70" y="168" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-1.5">agent-video-editor</text>
    <text x="72" y="212" fill="#AEB4C2" font-size="23">El criterio de un editor de YouTube, para cualquier agente de IA.</text>
  </g>

  <g transform="translate(72 258)" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="11" fill="#6B7280">
    <rect x="0" y="0" width="1136" height="128" rx="12" fill="#0A0C10" stroke="#262B36"/>

    <g transform="translate(16 14)">
      <text x="0" y="9">00:00</text><text x="250" y="9">00:05</text><text x="500" y="9">00:10</text>
      <text x="750" y="9">00:15</text><text x="1000" y="9">00:20</text>
    </g>

    <text x="16" y="44">VOZ</text>
    <rect x="78" y="32" width="300" height="18" rx="4" fill="url(#voz)"/>
    <rect x="390" y="32" width="250" height="18" rx="4" fill="url(#voz)"/>
    <rect x="652" y="32" width="330" height="18" rx="4" fill="url(#voz)"/>
    <rect x="994" y="32" width="126" height="18" rx="4" fill="url(#voz)"/>

    <text x="16" y="72">PANTALLA</text>
    <rect x="78" y="60" width="326" height="18" rx="4" fill="#5B8DEF"/>
    <rect x="404" y="60" width="22" height="18" fill="url(#fade)"/>
    <rect x="426" y="60" width="226" height="18" rx="4" fill="#5B8DEF"/>
    <rect x="652" y="60" width="468" height="18" rx="4" fill="#5B8DEF"/>

    <text x="16" y="100">GRÁFICO</text>
    <rect x="700" y="88" width="230" height="18" rx="4" fill="#3FBF8F"/>

    <text x="16" y="122" fill="#4B5160">MÚSICA</text>
    <path d="M78 117 Q 140 111 202 117 T 326 117 T 450 117 T 574 117 T 698 117 T 822 117 T 946 117 T 1070 117 L1120 117" fill="none" stroke="#8B7CF6" stroke-opacity="0.75" stroke-width="2"/>

    <line x1="752" y1="24" x2="752" y2="128" stroke="#FF5A5F" stroke-width="2"/>
    <path d="M746 24 h12 l-6 8 z" fill="#FF5A5F"/>

    <g fill="#E5E7EB" font-size="10.5">
      <path d="M390 29 v-5 h36 v5 M408 24 V-4" fill="none" stroke="#F5B83D" stroke-width="1.2"/>
      <text x="390" y="-10" fill="#F5B83D">corte J · la voz entra antes</text>
    </g>
  </g>
</svg>
