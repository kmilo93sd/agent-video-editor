<style>
  .gfx-checkmark {
    --gfx-accent: #16a34a;
    --gfx-mark: #ffffff;
    --gfx-x: 860px;
    --gfx-y: 440px;
    --gfx-w: 200px;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gfx-checkmark .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    top: var(--gfx-y);
    width: var(--gfx-w);
  }
  .gfx-checkmark svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
  }
  .gfx-checkmark .gfx-disc {
    fill: var(--gfx-accent);
  }
  .gfx-checkmark .gfx-stroke {
    fill: none;
    stroke: var(--gfx-mark);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }
</style>
<div class="clip gfx-checkmark" id="gfx-checkmark-1" data-start="0" data-duration="2" data-track-index="3">
  <div class="gfx-body">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="gfx-disc" cx="50" cy="50" r="46" />
      <path class="gfx-stroke" pathLength="100" d="M28 52 L44 67 L73 36" />
    </svg>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.checkmark = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    const strokes = [...el.querySelectorAll(".gfx-stroke")];
    tl.fromTo(body, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, at);
    strokes.forEach((s, i) => {
      tl.fromTo(s, { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at + 0.2 + i * 0);
    });
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
