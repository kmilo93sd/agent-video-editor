<!-- gfx:box-highlight | CC0-1.0 | agent-video-editor graphics kit -->
<style>
  .gfx-box-highlight {
    --gfx-accent: #ffc531;
    --gfx-border: 6px;
    --gfx-radius: 14px;
    --gfx-x: 640px;
    --gfx-y: 420px;
    --gfx-w: 640px;
    --gfx-h: 120px;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gfx-box-highlight .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    top: var(--gfx-y);
    width: var(--gfx-w);
    height: var(--gfx-h);
  }
  .gfx-box-highlight .gfx-frame {
    position: absolute;
    inset: 0;
    border: var(--gfx-border) solid var(--gfx-accent);
    border-radius: var(--gfx-radius);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25), 0 8px 28px rgba(0, 0, 0, 0.35);
  }
</style>
<div class="clip gfx-box-highlight" id="gfx-box-highlight-1" data-start="0" data-duration="2.5" data-track-index="3">
  <div class="gfx-body">
    <div class="gfx-frame"></div>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.boxHighlight = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    tl.fromTo(body, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at);
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
