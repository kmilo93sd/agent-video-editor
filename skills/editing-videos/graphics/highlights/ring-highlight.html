<!-- gfx:ring-highlight | CC0-1.0 | agent-video-editor graphics kit -->
<style>
  .gfx-ring-highlight {
    --gfx-accent: #ffc531;
    --gfx-ring: 8px;
    --gfx-x: 820px;
    --gfx-y: 400px;
    --gfx-w: 280px;
    --gfx-h: 280px;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gfx-ring-highlight .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    top: var(--gfx-y);
    width: var(--gfx-w);
    height: var(--gfx-h);
  }
  .gfx-ring-highlight .gfx-ring,
  .gfx-ring-highlight .gfx-echo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: var(--gfx-ring) solid var(--gfx-accent);
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.35), inset 0 0 18px rgba(0, 0, 0, 0.2);
  }
  .gfx-ring-highlight .gfx-echo {
    box-shadow: none;
    opacity: 0;
  }
</style>
<div class="clip gfx-ring-highlight" id="gfx-ring-highlight-1" data-start="0" data-duration="2.5" data-track-index="3">
  <div class="gfx-body">
    <div class="gfx-echo"></div>
    <div class="gfx-ring"></div>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.ringHighlight = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    const ring = el.querySelector(".gfx-ring");
    const echo = el.querySelector(".gfx-echo");
    tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.2 }, at);
    tl.fromTo(ring, { scale: 1.25 }, { scale: 1, duration: 0.4, ease: "power3.out" }, at);
    tl.fromTo(echo, { scale: 1, opacity: 0.8 }, { scale: 1.35, opacity: 0, duration: 0.7, ease: "power2.out" }, at + 0.4);
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
