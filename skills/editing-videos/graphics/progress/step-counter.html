<!-- gfx:step-counter | CC0-1.0 | agent-video-editor graphics kit -->
<style>
  .gfx-step-counter {
    --gfx-paper: rgba(17, 20, 24, 0.88);
    --gfx-ink: #ffffff;
    --gfx-accent: #ffc531;
    --gfx-off: rgba(255, 255, 255, 0.28);
    --gfx-font: system-ui, sans-serif;
    --gfx-x: 192px;
    --gfx-y: 108px;
    --gfx-size: 38px;
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-family: var(--gfx-font);
  }
  .gfx-step-counter .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    top: var(--gfx-y);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 16px 26px;
    background: var(--gfx-paper);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  .gfx-step-counter .gfx-label {
    margin: 0;
    color: var(--gfx-ink);
    font-size: var(--gfx-size);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .gfx-step-counter .gfx-dots {
    display: flex;
    gap: 12px;
  }
  .gfx-step-counter .gfx-dot {
    position: relative;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--gfx-off);
  }
  .gfx-step-counter .gfx-dot.is-done {
    background: var(--gfx-accent);
  }
  .gfx-step-counter .gfx-fill {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gfx-accent);
  }
</style>
<div class="clip gfx-step-counter" id="gfx-step-counter-1" data-start="0" data-duration="4" data-track-index="5">
  <div class="gfx-body">
    <p class="gfx-label">Step 2 of 5</p>
    <div class="gfx-dots">
      <div class="gfx-dot is-done"></div>
      <div class="gfx-dot"><div class="gfx-fill"></div></div>
      <div class="gfx-dot"></div>
      <div class="gfx-dot"></div>
      <div class="gfx-dot"></div>
    </div>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.stepCounter = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    tl.fromTo(body, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at);
    tl.fromTo(el.querySelector(".gfx-fill"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, o.fillAt ?? at + 0.35);
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
