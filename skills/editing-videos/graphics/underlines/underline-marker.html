<style>
  .gfx-underline-marker {
    --gfx-accent: #ffc531;
    --gfx-stroke: 22;
    --gfx-opacity: 0.85;
    --gfx-x: 640px;
    --gfx-y: 560px;
    --gfx-w: 520px;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gfx-underline-marker .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    top: var(--gfx-y);
    width: var(--gfx-w);
  }
  .gfx-underline-marker svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .gfx-underline-marker path {
    fill: none;
    stroke: var(--gfx-accent);
    stroke-opacity: var(--gfx-opacity);
    stroke-width: var(--gfx-stroke);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }
</style>
<div class="clip gfx-underline-marker" id="gfx-underline-marker-1" data-start="0" data-duration="2.5" data-track-index="3">
  <div class="gfx-body">
    <svg viewBox="0 0 500 40" aria-hidden="true">
      <path class="gfx-line" pathLength="100" d="M14 24 C120 18 300 16 486 20" />
    </svg>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.underlineMarker = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at);
    tl.fromTo(el.querySelector(".gfx-line"), { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, at);
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
