<!-- gfx:lower-third | CC0-1.0 | agent-video-editor graphics kit -->
<style>
  .gfx-lower-third {
    --gfx-paper: #111418;
    --gfx-ink: #ffffff;
    --gfx-muted: #c7ccd4;
    --gfx-accent: #ffc531;
    --gfx-font: system-ui, sans-serif;
    --gfx-x: 192px;
    --gfx-bottom: 150px;
    --gfx-name-size: 52px;
    --gfx-role-size: 34px;
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-family: var(--gfx-font);
  }
  .gfx-lower-third .gfx-body {
    position: absolute;
    left: var(--gfx-x);
    bottom: var(--gfx-bottom);
    display: flex;
    align-items: stretch;
    max-width: 1100px;
  }
  .gfx-lower-third .gfx-bar {
    width: 12px;
    background: var(--gfx-accent);
    border-radius: 4px;
    transform-origin: 50% 100%;
  }
  .gfx-lower-third .gfx-plate {
    padding: 18px 30px 20px 26px;
    background: var(--gfx-paper);
    border-radius: 0 12px 12px 0;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
  }
  .gfx-lower-third .gfx-name {
    margin: 0;
    color: var(--gfx-ink);
    font-size: var(--gfx-name-size);
    font-weight: 800;
    line-height: 1.1;
  }
  .gfx-lower-third .gfx-role {
    margin: 6px 0 0;
    color: var(--gfx-muted);
    font-size: var(--gfx-role-size);
    line-height: 1.2;
  }
</style>
<div class="clip gfx-lower-third" id="gfx-lower-third-1" data-start="0" data-duration="5" data-track-index="6">
  <div class="gfx-body">
    <div class="gfx-bar"></div>
    <div class="gfx-plate">
      <p class="gfx-name">Ana Rivera</p>
      <p class="gfx-role">Support lead, Demo Corp</p>
    </div>
  </div>
</div>
<script>
  window.gfx = window.gfx || {};
  window.gfx.lowerThird = function (tl, el, o = {}) {
    const at = o.at ?? +el.dataset.start;
    const dur = o.duration ?? +el.dataset.duration;
    const body = el.querySelector(".gfx-body");
    tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.1 }, at);
    tl.fromTo(el.querySelector(".gfx-bar"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, at);
    tl.fromTo(el.querySelector(".gfx-plate"), { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at + 0.12);
    tl.fromTo(el.querySelector(".gfx-role"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at + 0.35);
    tl.fromTo(body, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, at + dur - 0.25);
    return tl;
  };
</script>
